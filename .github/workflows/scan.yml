name: Scan RAM prices
on:
  push:
    paths:
      - 'monitor.py'
      - 'requirements.txt'
      - 'config.json'
      - 'watchlist.csv'
      - '.github/workflows/scan.yml'
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

concurrency:
  group: ram-hunter
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Scan products and alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: Save price history and dashboard snapshot safely
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(mktemp)"
          cp docs/data.json "$snapshot"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The scanner may have started before a code/docs commit landed.
          # Always base its snapshot commit on current main instead of using a stale HEAD.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot" docs/data.json
            git add docs/data.json
            if git diff --cached --quiet; then
              echo "No new scan data to save"
              break
            fi
            git commit -m 'chore: refresh RAM scan'
            if git push origin HEAD:main; then
              echo "Saved scan data on current main"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Repeated concurrent GitHub updates prevented saving scan data" >&2
              exit 1
            fi
            echo "Remote changed during scan; retrying against newest main"
          done

  publish:
    name: Publish dashboard to GitHub Pages
    needs: scan
    runs-on: ubuntu-latest
    concurrency:
      group: ram-deal-hunter-pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Checkout the latest main so it contains the new price data committed by scan.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
