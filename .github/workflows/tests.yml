name: Test
on:
  push:
    paths-ignore:
      - 'docs/data.json'
      - 'docs/local-data.json'
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --check docs/merge.js
      - run: node tests/test_merge.js
