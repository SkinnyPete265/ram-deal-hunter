name: Test
on:
  push:
    paths-ignore:
      - 'docs/data.json'
      - 'docs/local-data.json'
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: node --check docs/merge.js
      - run: node tests/test_merge.js
      - name: Check Windows PowerShell script syntax
        shell: pwsh
        run: |
          $paths = @('scripts/Run-LocalScan.ps1', 'scripts/Install-LocalScanner.ps1', 'scripts/Uninstall-LocalScanner.ps1')
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $_" }
              exit 1
            }
            Write-Host "OK: $path"
          }
